[workspace]
resolver = "2"
members = ["crates/drivich-core", "crates/drivich-server", "crates/drivich-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Theo-lbg"]
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
