[package]
name = "drivich-core"
description = "Drivich - self-hosted file storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
libc = "0.2.191"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "process"] }
tracing = "0.1.44"
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
image = "0.25.9"
tokio = "1.53.3"
