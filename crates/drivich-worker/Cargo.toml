[package]
name = "drivich-worker"
description = "Drivich - self-hosted file storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "drivich-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
drivich-core = { version = "0.1.0", path = "../drivich-core" }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = "1.26.1"
