[package]
name = "drivich-server"
description = "Drivich - self-hosted file storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "drivich-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
drivich-core = { version = "0.1.0", path = "../drivich-core" }
futures-util = "0.3.34"
hex = "0.4.3"
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
time = "0.3.45"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal", "net"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "compression-gzip", "limit", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
