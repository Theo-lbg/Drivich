#
# SonarCloud (free for public repositories). Analysis runs from CI:
# .github/workflows/sonar.yml. Adjust organization/projectKey to what
# SonarCloud shows when you import the repository.
sonar.organization=theo-lbg
sonar.projectKey=Theo-lbg_Drivich
sonar.projectName=Drivich

sonar.sources=crates,web/src
sonar.tests=crates/drivich-server/tests,crates/drivich-core/tests
sonar.exclusions=**/target/**,web/src/lib/api-schema.d.ts,web/src/lib/i18n/locales/**,docs/openapi.json,**/migrations/**
sonar.test.inclusions=**/tests/**
sonar.coverage.exclusions=crates/drivich-server/src/main.rs,crates/drivich-worker/src/main.rs,crates/drivich-core/build.rs,web/**,**/tests/**

# Produced by: cargo llvm-cov --workspace --lcov --output-path target/lcov.info
sonar.rust.lcov.reportPaths=target/lcov.info

sonar.sourceEncoding=UTF-8
