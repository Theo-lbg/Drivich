#
# Base images are pinned by digest (like Immich does), so updates arrive as pull
# requests instead of silently: Rust crates, npm packages, Dockerfile/compose
# images and GitHub Actions.
#
# Everything lands in ONE pull request ("dependencies"): while it stays open,
# Dependabot keeps updating that same PR (new versions, rebases) instead of
# opening a new one per package. Commit messages follow the repository's
# `type(scope): subject` convention checked by the "Git checks" workflow.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule: { interval: weekly }
    labels: [dependencies]
    commit-message: { prefix: chore, include: scope }

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: npm
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # TypeScript 7 (native rewrite) breaks svelte-check and the SvelteKit build for now.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /server
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /worker
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker-compose
    directory: /compose
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
