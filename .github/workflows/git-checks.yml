name: 🐙 Git checks

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check-branch-name:
    name: 🔍 Check branch name
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check branch name respects naming conventions
        id: branchnamecheck
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "🔍 Checking branch name..."
          ALLOWED_PREFIXES="feature feat fix hotfix release chore dependabot docs test refactor style"
          BRANCH_NAME_VALID=false
          for PREFIX in $ALLOWED_PREFIXES; do
            if [[ "$HEAD_REF" == $PREFIX/* ]]; then
              echo "✅ $HEAD_REF respects prefix $PREFIX"
              BRANCH_NAME_VALID=true
            else
              echo "❌ $HEAD_REF DOES NOT respect prefix $PREFIX"
            fi
          done
          if [[ $BRANCH_NAME_VALID == true ]]; then
            echo "✅ [SUCCESS] - Your branch name respects the naming convention"
          else
            echo "❌ [FAIL] - Branch $HEAD_REF does not respect the naming convention, please rename"
            exit 1
          fi

  check-commit-name:
    name: 🔍 Check commit(s)
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit name
        id: checkcommitname
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "🔍 Check commit name respects naming conventions.."
          count=$(git rev-list --count "origin/$BASE_REF..origin/$HEAD_REF")
          ALLOWED_PREFIXES="feat fix docs style refactor test chore"
          ALL_COMMIT_NAME_VALID=true
          if [ "$count" == 0 ]; then
            ALL_COMMIT_NAME_VALID=false
          else
            echo "🔍 Checking last commit"
            message=$(git log -1 --format=%s "origin/$HEAD_REF")
            COMMIT_NAME_VALID=false
            for PREFIX in $ALLOWED_PREFIXES; do
              if [[ "$message" == $PREFIX\(*\):\ * ]]; then
                COMMIT_NAME_VALID=true
                echo "✅ $message respects prefix $PREFIX"
              else
                echo "❌ $message DOES NOT respect prefix $PREFIX"
              fi
            done
            if [[ $COMMIT_NAME_VALID == false ]]; then
              ALL_COMMIT_NAME_VALID=false
            fi
          fi
          if [[ $ALL_COMMIT_NAME_VALID == true ]]; then
            echo "✅ [SUCCESS] - All your commit(s) respect the naming convention"
          else
            echo "❌ [FAIL] - At least one commit message does not respect the naming convention, please rename"
            exit 1
          fi

  up-to-date:
    name: 🔍 Check branch up to date
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check up to date
        id: checkuptodate
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "🔍 Check branch is up to date.."
          count=$(git rev-list --count "origin/$HEAD_REF..origin/$BASE_REF")
          if [ "$count" == 0 ]; then
            echo "✅ [SUCCESS] - Your branch is up to date"
          else
            echo "❌ [FAIL] - your branch is $count commits late. Please rebase."
            exit 1
          fi
