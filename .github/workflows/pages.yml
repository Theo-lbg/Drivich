#
# Publishes the live demo (https://<owner>.github.io/<repository>/): the real web
# app with a small in-browser stand-in for the API (web/src/lib/demo), so it
# needs no server. One-time setup: Settings > Pages > Source = "GitHub Actions".
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build:demo
        env: { DEMO_BASE: "/${{ github.event.repository.name }}" }
      - run: touch build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/build }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
