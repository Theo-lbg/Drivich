name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: drivich
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: drivich
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drivich" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://drivich:ci-only-password@localhost:5432/drivich
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace   # includes the check that docs/openapi.json is up to date

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run check:i18n
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/init-env.sh
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose -f deployment/docker-compose.release.yml config -q
        env: { DB_PASSWORD: ci-only }
