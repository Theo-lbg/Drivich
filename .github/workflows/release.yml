#
# Publishes the three images to ghcr.io on a version tag (v1.2.3) and attaches the
# ready-to-run compose file to the GitHub release. Nothing runs until a tag is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: server, context: ".", file: server/Dockerfile }
          - { name: worker, context: ".", file: worker/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/theo-lbg/drivich-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=release
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin the compose file to this version
        run: sed -i "s/DRIVICH_VERSION:-release/DRIVICH_VERSION:-${GITHUB_REF_NAME#v}/" deployment/docker-compose.release.yml
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            deployment/docker-compose.release.yml
            .env.example
