#
# Publishes the three images to ghcr.io on a version tag (v1.2.3) and attaches the
# ready-to-run compose file, example.env and init-env.sh to the GitHub release.
# Nothing runs until a tag is pushed.
#
# No emulation: the Rust images are built on a native amd64 and a native arm64
# runner, then joined into one multi-architecture image. The web image only copies
# static files into nginx, so one job builds both architectures.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/theo-lbg

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/drivich-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=release
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  rust:
    strategy:
      fail-fast: true
      matrix:
        name: [server, worker]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/drivich-${{ matrix.name }}
      # Pushed by digest only; the tags are added when both architectures are joined.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.name }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/drivich-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        name: [server, worker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/drivich-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=release
      - name: Join amd64 and arm64 under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/drivich-${{ matrix.name }}@sha256:%s ' *)
      - name: Show the result
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/drivich-${{ matrix.name }}:release

  release:
    needs: [web, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Assets named like Immich's, without a leading dot (GitHub renames those).
      - name: Prepare the release files, compose pinned to this version
        run: |
          mkdir dist
          sed "s/DRIVICH_VERSION:-release/DRIVICH_VERSION:-${GITHUB_REF_NAME#v}/" deployment/docker-compose.release.yml > dist/docker-compose.yml
          cp .env.example dist/example.env
          cp scripts/init-env.sh dist/init-env.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/docker-compose.yml
            dist/example.env
            dist/init-env.sh
