<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title>Drivich</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Drivich" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// Apply the saved theme before first paint (no flash of the wrong theme).
			try {
				var t = JSON.parse(localStorage.getItem('drivich.theme'));
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
